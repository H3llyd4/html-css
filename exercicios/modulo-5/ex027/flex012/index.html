<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlexBox</title>
    <style>
        div.conteiner {
            background-color: lightcoral;
            display: flex;
            flex-flow: row nowrap;

            
        }

        div.item {
            background-color: lightgreen;
            border: 1px solid black;
            text-align: center;
            
        }

        #cxa {
            /*flex-shrink: 1;
            flex-grow: 1;
            flex-basis: 200px; */
            
            flex: 1 0 150px;
        }

        #cxb {
           /* flex-shrink: 1;
            flex-grow: 1;
            flex-basis: 150px; */
            
            flex: 1 1 150px;
        }

        #cxc {
            /* flex-shrink: 1;
            flex-grow: 1;
            flex-basis: auto; */

            flex: 1 1 auto;
        }
    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="cxa">A</div>
        <div class="item" id="cxb">B</div>
        <div class="item" id="cxc">C</div>
    </div>
</body>
</html>
